services:
  garage:
    build:
      context: ./garage
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RPC_SECRET: "${RPC_SECRET:?RPC_SECRET is required — set it in Coolify > Environment Variables (openssl rand -hex 32)}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required — set it in Coolify > Environment Variables (openssl rand -hex 32)}"
      GARAGE_CAPACITY: "${GARAGE_CAPACITY:-64G}"
      GARAGE_ZONE: "${GARAGE_ZONE:-dc1}"
      GARAGE_STARTUP_TIMEOUT: "${GARAGE_STARTUP_TIMEOUT:-60}"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"
      - "3902"
      - "3903"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3903/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      start_interval: 2s
      retries: 3

  garage-webui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    environment:
      API_BASE_URL: "http://garage:3903"
      API_ADMIN_KEY: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      S3_ENDPOINT_URL: "http://garage:3900"
      AUTH_USER_PASS: "${AUTH_USER_PASS:?AUTH_USER_PASS is required — format user:<bcrypt hash>}"
    expose:
      - "3909"
    depends_on:
      garage:
        condition: service_healthy

volumes:
  garage-meta:
  garage-data:
